# Stock Screener – Apache-Konfiguration für 192.168.178.25
# Wird nach /etc/apache2/conf-enabled/stock-screener.conf kopiert.
#
# Die App liegt statisch unter /stock-screener/ (Docroot /var/www/html/stock-screener).
# Externe Datenquellen laufen über lokale Proxypfade (CORS: die Zielhoste
# senden keine Access-Control-Allow-Origin-Header).

Alias /stock-screener /var/www/html/stock-screener

# /stock-screener ohne Slash -> relative Assets würden falsch aufgelöst
RedirectMatch 301 ^/stock-screener$ /stock-screener/

<Directory /var/www/html/stock-screener>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Wasm-MIME (falls mime.types es nicht liefert)
    AddType application/wasm .wasm
</Directory>

# --- CORS-Proxy für die Datenquellen der App ---
# HTTPS-Backends brauchen SSLProxyEngine (mod_ssl).
SSLProxyEngine On

<Location /stock-screener/proxy/yahoo/>
    ProxyPass https://query1.finance.yahoo.com/
    ProxyPassReverse https://query1.finance.yahoo.com/
    RequestHeader set User-Agent "Mozilla/5.0"
</Location>

<Location /stock-screener/proxy/nasdaqtrader/>
    ProxyPass https://www.nasdaqtrader.com/
    ProxyPassReverse https://www.nasdaqtrader.com/
    RequestHeader set User-Agent "Mozilla/5.0"
</Location>

<Location /stock-screener/proxy/githubraw/>
    ProxyPass https://raw.githubusercontent.com/
    ProxyPassReverse https://raw.githubusercontent.com/
</Location>

<Location /stock-screener/proxy/wikipedia/>
    ProxyPass https://en.wikipedia.org/
    ProxyPassReverse https://en.wikipedia.org/
    RequestHeader set User-Agent "Mozilla/5.0 (StockScreener)"
</Location>
